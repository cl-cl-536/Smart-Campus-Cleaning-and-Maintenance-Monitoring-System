<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Campus Cleaning & Maintenance Monitoring System - Login</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- Theme Toggle in top-right -->
  <div style="position: absolute; top: 20px; right: 20px; z-index: 50;">
    <button class="theme-toggle-btn" title="Toggle Dark/Light Mode">
      <i class="fas fa-moon"></i>
    </button>
  </div>

  <div class="login-page-wrap">
    <div class="login-card">
      <div class="login-logo">
        <div class="logo-icon">
          <i class="fas fa-building-shield"></i>
        </div>
        <div>
          <h2 style="font-size: 18px; font-weight: 800; color: var(--text-main); letter-spacing: -0.02em;">Smart Campus</h2>
          <span style="font-size: 12px; color: var(--primary-600); font-weight: 600;">Cleaning & Maintenance System</span>
        </div>
      </div>

      <div class="login-header">
        <h1>Welcome Back</h1>
        <p>Sign in to access your role-based maintenance monitoring portal</p>
      </div>

      <!-- Quick Demo Account Switcher (HMI Excellence) -->
      <div class="demo-accounts-box">
        <h4><i class="fas fa-key"></i> Quick Demo Logins (Click to Fill)</h4>
        <div class="demo-buttons-grid">
          <button type="button" class="demo-btn" onclick="quickFill('admin', 'admin123')">
            <span>Admin</span>
            <span class="demo-role-badge">admin</span>
          </button>
          <button type="button" class="demo-btn" onclick="quickFill('supervisor', 'super123')">
            <span>Supervisor</span>
            <span class="demo-role-badge">supervisor</span>
          </button>
          <button type="button" class="demo-btn" onclick="quickFill('staff1', 'staff123')">
            <span>Staff 1</span>
            <span class="demo-role-badge">staff</span>
          </button>
          <button type="button" class="demo-btn" onclick="quickFill('reporter', 'report123')">
            <span>Reporter</span>
            <span class="demo-role-badge">student</span>
          </button>
        </div>
      </div>

      <!-- Error Message Banner -->
      <div id="login-error-alert" style="display: none; background: #fee2e2; border: 1px solid #fca5a5; color: #b91c1c; padding: 12px 16px; border-radius: var(--radius-md); font-size: 13px; font-weight: 600; margin-bottom: 20px; align-items: center; gap: 8px;">
        <i class="fas fa-circle-exclamation"></i>
        <span id="login-error-text">Invalid username or password.</span>
      </div>

      <!-- Login Form -->
      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <div style="position: relative;">
            <i class="fas fa-user" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-subtle);"></i>
            <input type="text" id="username" class="form-control" style="padding-left: 38px;" placeholder="e.g. admin, supervisor, staff1, reporter" required autocomplete="username">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div style="position: relative;">
            <i class="fas fa-lock" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-subtle);"></i>
            <input type="password" id="password" class="form-control" style="padding-left: 38px; padding-right: 40px;" placeholder="Enter password" required autocomplete="current-password">
            <button type="button" id="toggle-password" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); padding: 4px;" title="Show/Hide Password">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" id="submit-login-btn" class="btn btn-primary btn-block btn-lg" style="margin-top: 10px;">
          <span id="btn-text">Sign In</span>
          <i class="fas fa-arrow-right" style="font-size: 13px;"></i>
        </button>

        <!-- Create Account Link -->
        <div style="margin-top: 18px; text-align: center; font-size: 13px; color: var(--text-muted);">
          <span>Don't have an account?</span>
          <a href="/signup.html" id="link-create-account" style="color: var(--primary-600); font-weight: 700; margin-left: 4px; text-decoration: underline;">Create account</a>
        </div>
      </form>

      <div style="margin-top: 24px; text-align: center; font-size: 12px; color: var(--text-muted);">
        <p>HMI Course Project &bull; Human-Centered Campus Operations</p>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
